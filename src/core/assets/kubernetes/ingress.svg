<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <title>Ingress</title>
    <defs>
        <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop stop-color="#1A4B8E" offset="0%"/>
            <stop stop-color="#326CE5" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="url(#bg)" width="256" height="256" rx="20"/>
    <!-- Triangle pointing right -->
    <polygon points="80,56 80,200 210,128" fill="none" stroke="#FFF" stroke-width="6" stroke-linejoin="round"/>
    <!-- Horizontal lines (HTTP routes) -->
    <line x1="108" y1="98" x2="188" y2="98" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="108" y1="128" x2="188" y2="128" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="108" y1="158" x2="188" y2="158" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Small dots at line ends -->
    <circle cx="108" cy="98" r="4" fill="#FFF"/>
    <circle cx="108" cy="128" r="4" fill="#FFF"/>
    <circle cx="108" cy="158" r="4" fill="#FFF"/>
</svg>
