<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <title>cert-manager</title>
    <defs>
        <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop stop-color="#1A4B8E" offset="0%"/>
            <stop stop-color="#326CE5" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="url(#bg)" width="256" height="256" rx="20"/>
    <!-- Certificate body -->
    <rect x="55" y="50" width="146" height="165" rx="10" fill="#FFF"/>
    <!-- Ribbon tails -->
    <path d="M105 195 L90 230 L105 220 L120 230 L105 195" fill="#FFF"/>
    <path d="M151 195 L136 230 L151 220 L166 230 L151 195" fill="#FFF"/>
    <!-- Ribbon circle -->
    <circle cx="128" cy="195" r="18" fill="#FFF"/>
    <circle cx="128" cy="195" r="12" fill="url(#bg)"/>
    <!-- Checkmark inside ribbon -->
    <path d="M121 195 L126 200 L136 190" fill="none" stroke="#FFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Horizontal lines on certificate -->
    <rect x="80" y="80" width="96" height="6" rx="3" fill="url(#bg)" opacity="0.2"/>
    <rect x="80" y="98" width="76" height="6" rx="3" fill="url(#bg)" opacity="0.2"/>
    <rect x="80" y="116" width="88" height="6" rx="3" fill="url(#bg)" opacity="0.2"/>
    <rect x="80" y="134" width="60" height="6" rx="3" fill="url(#bg)" opacity="0.2"/>
    <!-- Seal/star at top -->
    <circle cx="128" cy="65" r="10" fill="url(#bg)" opacity="0.25"/>
</svg>
