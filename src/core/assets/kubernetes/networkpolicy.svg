            <stop stop-color="#1A4B8E" offset="0%"/>
            <stop stop-color="#326CE5" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="url(#bg)" width="256" height="256" rx="20"/>
    <!-- Shield shape -->
    <path d="M128,36 L196,72 L196,140 C196,180 164,212 128,228 C92,212 60,180 60,140 L60,72 Z" fill="none" stroke="#FFF" stroke-width="6" stroke-linejoin="round"/>
