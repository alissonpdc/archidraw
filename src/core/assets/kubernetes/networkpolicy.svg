    <circle cx="100" cy="148" r="8" fill="#FFF"/>
    <circle cx="156" cy="148" r="8" fill="#FFF"/>
    <circle cx="112" cy="176" r="7" fill="#FFF"/>
    <circle cx="144" cy="176" r="7" fill="#FFF"/>
    <!-- Network connections -->
    <line x1="128" y1="120" x2="100" y2="148" stroke="#FFF" stroke-width="2.5"/>
    <line x1="128" y1="120" x2="156" y2="148" stroke="#FFF" stroke-width="2.5"/>
    <line x1="100" y1="148" x2="112" y2="176" stroke="#FFF" stroke-width="2.5"/>
    <line x1="156" y1="148" x2="144" y2="176" stroke="#FFF" stroke-width="2.5"/>
    <line x1="112" y1="176" x2="144" y2="176" stroke="#FFF" stroke-width="2.5"/>
    <!-- Lock icon at bottom -->
    <rect x="116" y="192" width="24" height="18" rx="3" fill="#FFF"/>
    <path d="M122,192 L122,184 C122,178 134,178 134,184 L134,192" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
