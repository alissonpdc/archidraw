<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <title>ReplicaSet</title>
    <defs>
        <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop stop-color="#1A4B8E" offset="0%"/>
            <stop stop-color="#326CE5" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="url(#bg)" width="256" height="256" rx="20"/>
    <!-- Diamond shape -->
    <polygon points="128,40 216,128 128,216 40,128" fill="none" stroke="#FFF" stroke-width="6" stroke-linejoin="round"/>
    <!-- Copy/multiplication symbol -->
    <line x1="98" y1="98" x2="158" y2="158" stroke="#FFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="158" y1="98" x2="98" y2="158" stroke="#FFF" stroke-width="6" stroke-linecap="round"/>
    <!-- Small pod replicas -->
    <circle cx="72" cy="80" r="14" fill="none" stroke="#FFF" stroke-width="3"/>
    <circle cx="184" cy="80" r="14" fill="none" stroke="#FFF" stroke-width="3"/>
    <circle cx="72" cy="176" r="14" fill="none" stroke="#FFF" stroke-width="3"/>
    <circle cx="184" cy="176" r="14" fill="none" stroke="#FFF" stroke-width="3"/>
    <circle cx="72" cy="80" r="5" fill="#FFF"/>
    <circle cx="184" cy="80" r="5" fill="#FFF"/>
    <circle cx="72" cy="176" r="5" fill="#FFF"/>
    <circle cx="184" cy="176" r="5" fill="#FFF"/>
</svg>
