<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <title>Endpoint</title>
    <defs>
        <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop stop-color="#1A4B8E" offset="0%"/>
            <stop stop-color="#326CE5" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="url(#bg)" width="256" height="256" rx="20"/>
    <!-- Connection line -->
    <line x1="128" y1="96" x2="128" y2="160" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <!-- Top small circle (endpoint) -->
    <circle cx="128" cy="72" r="24" fill="none" stroke="#FFF" stroke-width="6"/>
    <circle cx="128" cy="72" r="8" fill="#FFF"/>
    <!-- Bottom large circle (service) -->
    <circle cx="128" cy="184" r="36" fill="none" stroke="#FFF" stroke-width="6"/>
    <!-- Radiating lines from large circle -->
    <line x1="128" y1="148" x2="128" y2="144" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="92" y1="184" x2="88" y2="184" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="164" y1="184" x2="168" y2="184" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="102" y1="162" x2="96" y2="156" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="154" y1="162" x2="160" y2="156" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Small dots -->
    <circle cx="128" cy="184" r="5" fill="#FFF"/>
</svg>
