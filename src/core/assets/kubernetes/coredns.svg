<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <title>CoreDNS</title>
    <defs>
        <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop stop-color="#1A4B8E" offset="0%"/>
            <stop stop-color="#326CE5" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="url(#bg)" width="256" height="256" rx="20"/>
    <!-- Globe circle -->
    <circle cx="128" cy="128" r="80" fill="none" stroke="#FFF" stroke-width="6"/>
    <!-- Globe vertical ellipse -->
    <ellipse cx="128" cy="128" rx="36" ry="80" fill="none" stroke="#FFF" stroke-width="4"/>
    <!-- Globe horizontal line -->
    <line x1="48" y1="128" x2="208" y2="128" stroke="#FFF" stroke-width="4"/>
    <!-- Globe latitude lines -->
    <path d="M64,96 C96,96 160,96 192,96" fill="none" stroke="#FFF" stroke-width="3"/>
    <path d="M64,160 C96,160 160,160 192,160" fill="none" stroke="#FFF" stroke-width="3"/>
    <!-- DNS text -->
    <text x="128" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="28" fill="#FFF">DNS</text>
</svg>
