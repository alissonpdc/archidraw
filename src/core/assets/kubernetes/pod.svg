<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <title>Kubernetes Pod</title>
    <defs>
        <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop stop-color="#1A4B8E" offset="0%"/>
            <stop stop-color="#326CE5" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="url(#bg)" width="256" height="256" rx="20"/>
    <!-- Rounded rectangle (pod body) -->
    <rect x="56" y="72" width="144" height="112" rx="28" fill="none" stroke="#FFF" stroke-width="6"/>
    <!-- Small circle inside (container) -->
    <circle cx="128" cy="128" r="24" fill="none" stroke="#FFF" stroke-width="5"/>
</svg>
