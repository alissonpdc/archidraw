<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <title>Node</title>
    <defs>
        <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop stop-color="#1A4B8E" offset="0%"/>
            <stop stop-color="#326CE5" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="url(#bg)" width="256" height="256" rx="20"/>
    <!-- Server rack -->
    <rect x="72" y="56" width="112" height="144" rx="8" fill="none" stroke="#FFF" stroke-width="6"/>
    <!-- Rack lines -->
    <line x1="72" y1="104" x2="184" y2="104" stroke="#FFF" stroke-width="6"/>
    <line x1="72" y1="152" x2="184" y2="152" stroke="#FFF" stroke-width="6"/>
    <!-- Status lights -->
    <circle cx="92" cy="80" r="6" fill="#FFF"/>
    <circle cx="92" cy="128" r="6" fill="#FFF"/>
    <circle cx="92" cy="176" r="6" fill="#FFF"/>
    <!-- Vent slots -->
    <line x1="112" y1="80" x2="164" y2="80" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="112" y1="128" x2="164" y2="128" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="112" y1="176" x2="164" y2="176" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Base -->
    <rect x="88" y="208" width="80" height="8" rx="4" fill="#FFF"/>
</svg>
