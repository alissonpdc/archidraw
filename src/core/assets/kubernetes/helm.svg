<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <title>Helm</title>
    <defs>
        <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop stop-color="#1A4B8E" offset="0%"/>
            <stop stop-color="#326CE5" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="url(#bg)" width="256" height="256" rx="20"/>
    <!-- Helm wheel outer -->
    <circle cx="128" cy="132" r="56" fill="none" stroke="#FFF" stroke-width="6"/>
    <!-- Center hub -->
    <circle cx="128" cy="132" r="14" fill="none" stroke="#FFF" stroke-width="5"/>
    <!-- Spokes -->
    <line x1="128" y1="76" x2="128" y2="118" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="128" y1="146" x2="128" y2="188" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="72" y1="132" x2="114" y2="132" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="142" y1="132" x2="184" y2="132" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <!-- Handle knobs -->
    <circle cx="128" cy="68" r="10" fill="#FFF"/>
    <circle cx="128" cy="196" r="10" fill="#FFF"/>
    <circle cx="64" cy="132" r="10" fill="#FFF"/>
    <circle cx="192" cy="132" r="10" fill="#FFF"/>
    <!-- Diagonal spokes -->
    <line x1="88.3" y1="92.3" x2="115.2" y2="119.2" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="140.8" y1="144.8" x2="167.7" y2="171.7" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="167.7" y1="92.3" x2="140.8" y2="119.2" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="115.2" y1="144.8" x2="88.3" y2="171.7" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <!-- Diagonal knobs -->
    <circle cx="80" cy="84" r="10" fill="#FFF"/>
    <circle cx="176" cy="84" r="10" fill="#FFF"/>
    <circle cx="80" cy="180" r="10" fill="#FFF"/>
    <circle cx="176" cy="180" r="10" fill="#FFF"/>
</svg>
