<?xml version="1.0" encoding="UTF-8"?>
<svg width="256px" height="256px" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <title>Kubernetes Scheduler</title>
    <defs>
        <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop stop-color="#1A4B8E" offset="0%"/>
            <stop stop-color="#326CE5" offset="100%"/>
        </linearGradient>
    </defs>
    <rect fill="url(#bg)" width="256" height="256" rx="20"/>
    <!-- Outer circle -->
    <circle cx="128" cy="128" r="88" fill="none" stroke="#FFF" stroke-width="5"/>
    <!-- Clock tick marks -->
    <line x1="128" y1="44" x2="128" y2="58" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="128" y1="198" x2="128" y2="212" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="44" y1="128" x2="58" y2="128" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="198" y1="128" x2="212" y2="128" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Clock hands -->
    <line x1="128" y1="128" x2="128" y2="76" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="128" y1="128" x2="168" y2="112" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="128" cy="128" r="6" fill="#FFF"/>
</svg>
