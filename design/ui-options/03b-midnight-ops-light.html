<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchiDraw · 03b Midnight Ops · Light</title>
<style>
:root {
  --canvas: #f4f6f8;
  --surface: #ffffff;
  --hover: #e9edf1;
  --ink: #1a2028;
  --muted: #5f6b78;
  --border: #d7dde4;
  --accent: #0d9271;
  --on-accent: #ffffff;
  --el-bg: #ffffff;
  --dot: rgba(26, 32, 40, 0.13);
  --radius: 6px;
  --shadow: 0 2px 10px rgba(20, 30, 40, 0.1);
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); overflow: hidden; color: var(--ink); }
.app { position: relative; width: 100%; height: 100%; background: var(--canvas); }
.canvas {
  position: absolute; inset: 0;
  background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: 24px 24px;
}
.diagram { width: 100%; height: 100%; }

.micro {
  font-family: var(--mono); font-size: 9px; font-weight: 500; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
}
.widget {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}

.toolbar {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; padding: 3px;
}
.tb {
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; color: var(--ink);
  border-radius: 5px; cursor: pointer; padding: 0;
}
.tb:hover { background: var(--hover); }
.tb.active { background: var(--accent); color: var(--on-accent); }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

.props {
  position: absolute; top: 50%; left: 16px; transform: translateY(-50%);
  width: 196px; padding: 12px 10px; display: flex; flex-direction: column; gap: 11px;
}
.ptabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.ptab {
  flex: 1; padding: 4px 8px; font-size: 12px; border: none; background: transparent;
  color: var(--muted); border-radius: 4px; cursor: pointer;
}
.ptab.active { background: var(--hover); color: var(--ink); font-weight: 600; }
.pgroup { display: flex; flex-direction: column; gap: 5px; }
.prow { display: flex; align-items: center; gap: 4px; }
.sw {
  width: 20px; height: 20px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--border); box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
}
.sw.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.szbtn {
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); background: transparent; color: var(--ink);
  border-radius: 5px; cursor: pointer; padding: 0;
}
.szbtn.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.bar { display: block; width: 14px; background: currentColor; border-radius: 1px; }

.tabbar {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; padding: 3px;
}
.tab {
  height: 28px; padding: 0 12px; display: flex; align-items: center; gap: 6px;
  border: none; background: transparent; color: var(--muted);
  font-size: 12px; font-family: var(--mono); border-radius: 4px; cursor: pointer;
}
.tab.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.tab:hover:not(.active) { background: var(--hover); color: var(--ink); }
.tabadd {
  width: 28px; height: 28px; border: none; background: transparent; color: var(--muted);
  border-radius: 4px; cursor: pointer; font-size: 15px;
}
.tabadd:hover { background: var(--hover); color: var(--ink); }

.bottom-right {
  position: absolute; bottom: 16px; right: 16px;
  display: flex; align-items: center; gap: 8px;
}
.zoom { display: flex; align-items: center; padding: 2px; }
.zbtn {
  width: 26px; height: 26px; border: none; background: transparent; color: var(--ink);
  border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.zbtn:hover { background: var(--hover); }
.zlevel {
  min-width: 48px; text-align: center; font-size: 11.5px; color: var(--muted);
  font-family: var(--mono); font-variant-numeric: tabular-nums;
}

.status {
  position: absolute; bottom: 20px; left: 16px;
  font-size: 11px; color: var(--muted); display: flex; gap: 12px; align-items: center;
  font-family: var(--mono);
}
.saved { color: var(--accent); font-weight: 600; }

.menu-btn {
  position: absolute; top: 12px; right: 16px;
  width: 36px; height: 34px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer;
}

.tag {
  position: fixed; top: 12px; left: 16px; padding: 4px 10px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em;
  color: var(--muted); text-transform: uppercase;
}
</style>
</head>
<body>
<div class="app">
  <div class="canvas">
    <svg class="diagram" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#1a2028"/>
        </marker>
      </defs>
      <path d="M220 358 H316" stroke="#5f6b78" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
      <path d="M470 350 H565" stroke="#5f6b78" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
      <path d="M470 372 C520 372 530 486 576 486" stroke="#5f6b78" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
      <path d="M395 330 C395 290 398 268 399 254" stroke="#5f6b78" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
      <path d="M400 180 L470 215 L400 250 L330 215 Z" fill="#ffffff" stroke="#1a2028" stroke-width="1.5"/>
      <text x="400" y="219" text-anchor="middle" font-size="12" fill="#1a2028" font-family="SF Mono, monospace">Auth</text>
      <rect x="90" y="330" width="130" height="56" rx="6" fill="#ffffff" stroke="#1a2028" stroke-width="1.5"/>
      <text x="155" y="362" text-anchor="middle" font-size="12" fill="#1a2028" font-family="SF Mono, monospace">Cliente Web</text>
      <rect x="320" y="330" width="150" height="56" rx="6" fill="#ffffff" stroke="#0d9271" stroke-width="2" filter="drop-shadow(0 0 6px rgba(13,146,113,.3))"/>
      <text x="395" y="362" text-anchor="middle" font-size="12" fill="#1a2028" font-family="SF Mono, monospace">API Gateway</text>
      <rect x="316" y="326" width="8" height="8" fill="#f4f6f8" stroke="#0d9271" stroke-width="1.5"/>
      <rect x="466" y="326" width="8" height="8" fill="#f4f6f8" stroke="#0d9271" stroke-width="1.5"/>
      <rect x="316" y="382" width="8" height="8" fill="#f4f6f8" stroke="#0d9271" stroke-width="1.5"/>
      <rect x="466" y="382" width="8" height="8" fill="#f4f6f8" stroke="#0d9271" stroke-width="1.5"/>
      <ellipse cx="645" cy="350" rx="75" ry="36" fill="#ffffff" stroke="#1a2028" stroke-width="1.5"/>
      <text x="645" y="354" text-anchor="middle" font-size="12" fill="#1a2028" font-family="SF Mono, monospace">PostgreSQL</text>
      <ellipse cx="645" cy="486" rx="62" ry="30" fill="#ffffff" stroke="#1a2028" stroke-width="1.5"/>
      <text x="645" y="490" text-anchor="middle" font-size="12" fill="#1a2028" font-family="SF Mono, monospace">Redis</text>
      <rect x="800" y="330" width="120" height="56" rx="6" fill="#e6f6f0" stroke="#0d9271" stroke-width="1.5"/>
      <text x="860" y="362" text-anchor="middle" font-size="12" fill="#0a6b53" font-family="SF Mono, monospace">Lambda</text>
      <path d="M570 350 H795" stroke="#5f6b78" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    </svg>
  </div>

  <div class="tag widget">03b · Midnight Ops · Light</div>

  <button class="menu-btn" aria-label="Menu">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>

  <div class="toolbar widget">
    <button class="tb active" title="Selecionar"><svg width="18" height="18" viewBox="0 0 20 20"><path d="M6 3l8 8-4.2.5 2 3.8-1.7.9-2-3.9L6 14z" fill="currentColor"/></svg></button>
    <button class="tb" title="Mão"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M7 12V6.2a1.3 1.3 0 0 1 2.6 0V11m0-5.8v-.9a1.3 1.3 0 0 1 2.6 0V11m0-4.3a1.3 1.3 0 0 1 2.6 0V13c0 2.6-1.9 4.2-4.4 4.2-2 0-3-.7-4-2.4l-2.1-3.6c-.5-.8.6-1.9 1.5-1.2L7 12"/></svg></button>
    <div class="sep"></div>
    <button class="tb" title="Retângulo"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="6" width="12" height="8" rx="1.5"/></svg></button>
    <button class="tb" title="Losango"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 4l6 6-6 6-6-6z"/></svg></button>
    <button class="tb" title="Elipse"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="10" cy="10" rx="6" ry="4.5"/></svg></button>
    <div class="sep"></div>
    <button class="tb" title="Linha"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 15L15 5"/></svg></button>
    <button class="tb" title="Seta"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 15L15 5M9 5h6v6"/></svg></button>
    <button class="tb" title="Texto"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 6h10M10 6v9"/></svg></button>
  </div>

  <div class="props widget">
    <div class="ptabs">
      <button class="ptab active">Estilo</button>
      <button class="ptab">Texto</button>
    </div>
    <div class="pgroup">
      <span class="micro">Preenchimento</span>
      <div class="prow">
        <div class="sw" style="background:#f4f6f8"></div>
        <div class="sw" style="background:#d7dde4"></div>
        <div class="sw on" style="background:#c8ecdf"></div>
        <div class="sw" style="background:#0d9271"></div>
        <div class="sw" style="background:#1a2028"></div>
      </div>
    </div>
    <div class="pgroup">
      <span class="micro">Traço</span>
      <div class="prow">
        <div class="sw on" style="background:#0d9271"></div>
        <div class="sw" style="background:#1a2028"></div>
        <div class="sw" style="background:#5f6b78"></div>
        <div class="sw" style="background:#b45309"></div>
        <div class="sw" style="background:#ffffff"></div>
      </div>
    </div>
    <div class="pgroup">
      <span class="micro">Espessura</span>
      <div class="prow">
        <button class="szbtn"><span class="bar" style="height:2px"></span></button>
        <button class="szbtn"><span class="bar" style="height:4px"></span></button>
        <button class="szbtn on"><span class="bar" style="height:6px"></span></button>
        <button class="szbtn"><span class="bar" style="height:8px"></span></button>
      </div>
    </div>
    <div class="pgroup">
      <span class="micro">Estilo do traço</span>
      <div class="prow">
        <button class="szbtn on"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 7h12" stroke="currentColor" stroke-width="2"/></svg></button>
        <button class="szbtn"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 7h12" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.5"/></svg></button>
        <button class="szbtn"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 7h12" stroke="currentColor" stroke-width="2" stroke-dasharray="1 3" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="pgroup">
      <span class="micro">Camadas</span>
      <div class="prow">
        <button class="szbtn" title="Para frente"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 11V3M3.5 6.5L7 3l3.5 3.5"/></svg></button>
        <button class="szbtn" title="Para trás"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 3v8M3.5 7.5L7 11l3.5-3.5"/></svg></button>
      </div>
    </div>
  </div>

  <div class="tabbar widget">
    <button class="tab">infra</button>
    <button class="tab active">checkout · pagamentos <span>×</span></button>
    <button class="tabadd">+</button>
  </div>

  <div class="bottom-right">
    <div class="zoom widget">
      <button class="zbtn">−</button>
      <span class="zlevel">100%</span>
      <button class="zbtn">+</button>
    </div>
    <div class="zoom widget">
      <button class="zbtn" title="Desfazer"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 7a4.5 4.5 0 1 1 1.3 3.2M3 7V3.5M3 7h3.5"/></svg></button>
      <button class="zbtn" title="Refazer"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M11 7a4 4 0 1 0-1.3 3.2M11 7V3.5M11 7H7.5"/></svg></button>
    </div>
  </div>

  <div class="status">
    <span class="saved">● Salvo</span>
    <span>8 elementos</span>
  </div>
</div>
</body>
</html>
