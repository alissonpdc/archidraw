<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchiDraw · 05 Swiss Ink</title>
<style>
:root {
  --canvas: #f0f0ee;
  --surface: #ffffff;
  --hover: #e8e8e6;
  --ink: #111111;
  --muted: #757575;
  --border: #111111;
  --accent: #e5322d;
  --on-accent: #ffffff;
  --el-bg: #ffffff;
  --radius: 0px;
  --shadow: 3px 3px 0 #111111;
  --font: "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); overflow: hidden; color: var(--ink); }
.app { position: relative; width: 100%; height: 100%; background: var(--canvas); }
.canvas {
  position: absolute; inset: 0;
  background-image: radial-gradient(rgba(17, 17, 17, 0.18) 1px, transparent 1px);
  background-size: 28px 28px;
}
.diagram { width: 100%; height: 100%; }

.micro {
  font-size: 9px; font-weight: 700; color: var(--ink);
  text-transform: uppercase; letter-spacing: 0.12em;
}
.widget {
  background: var(--surface); border: 2px solid var(--ink);
  border-radius: var(--radius); box-shadow: var(--shadow);
}

.toolbar {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 0; padding: 0;
}
.tb {
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; color: var(--ink); cursor: pointer; padding: 0;
}
.tb + .tb { border-left: 1px solid #dddddd; }
.tb:hover { background: var(--hover); }
.tb.active { background: var(--ink); color: var(--surface); }
.sep { width: 2px; height: 36px; background: var(--ink); }

.props {
  position: absolute; top: 50%; left: 18px; transform: translateY(-50%);
  width: 198px; padding: 0; display: flex; flex-direction: column;
}
.ptabs { display: flex; border-bottom: 2px solid var(--ink); }
.ptab {
  flex: 1; padding: 7px 8px; font-size: 11px; font-weight: 700; border: none; background: transparent;
  color: var(--muted); cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em;
}
.ptab + .ptab { border-left: 1px solid #dddddd; }
.ptab.active { color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
.pgroup { display: flex; flex-direction: column; gap: 5px; padding: 11px 12px 0; }
.pgroup:last-child { padding-bottom: 13px; }
.prow { display: flex; align-items: center; gap: 5px; }
.sw {
  width: 20px; height: 20px; border-radius: 0; cursor: pointer;
  border: 1.5px solid var(--ink);
}
.sw.on { outline: 2px solid var(--accent); outline-offset: 1.5px; }
.szbtn {
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  border-radius: 0; cursor: pointer; padding: 0;
}
.szbtn.on { background: var(--ink); color: var(--surface); }
.bar { display: block; width: 14px; background: currentColor; }

.tabbar {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 0; padding: 0;
}
.tab {
  height: 30px; padding: 0 14px; display: flex; align-items: center; gap: 6px;
  border: none; background: transparent; color: var(--ink);
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer;
}
.tab + .tab { border-left: 1px solid #dddddd; }
.tab.active { background: var(--ink); color: var(--surface); }
.tab:hover:not(.active) { background: var(--hover); }
.tabadd {
  width: 30px; height: 30px; border: none; border-left: 1px solid #dddddd;
  background: transparent; color: var(--ink); cursor: pointer; font-size: 15px;
}
.tabadd:hover { background: var(--hover); }

.bottom-right {
  position: absolute; bottom: 18px; right: 18px;
  display: flex; align-items: center; gap: 10px;
}
.zoom { display: flex; align-items: center; }
.zbtn {
  width: 28px; height: 28px; border: none; background: transparent; color: var(--ink);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.zbtn + .zbtn, .zlevel { border-left: 1px solid #dddddd; }
.zbtn:hover { background: var(--hover); }
.zlevel { min-width: 50px; text-align: center; font-size: 11.5px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

.status {
  position: absolute; bottom: 22px; left: 18px;
  font-size: 10px; color: var(--ink); display: flex; gap: 14px; align-items: center;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
}
.saved { color: var(--accent); }

.menu-btn {
  position: absolute; top: 14px; right: 18px;
  width: 38px; height: 36px; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
  border-radius: 0; box-shadow: var(--shadow); cursor: pointer;
}

.tag {
  position: fixed; top: 14px; left: 18px; padding: 5px 10px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  color: var(--ink); text-transform: uppercase;
}
</style>
</head>
<body>
<div class="app">
  <div class="canvas">
    <svg class="diagram" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
        </marker>
      </defs>
      <path d="M220 358 H316" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arr)"/>
      <path d="M470 350 H565" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arr)"/>
      <path d="M470 372 C520 372 530 486 576 486" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arr)"/>
      <path d="M395 330 C395 290 398 268 399 254" stroke="#111111" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
      <path d="M400 180 L470 215 L400 250 L330 215 Z" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="400" y="219" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">AUTH</text>
      <rect x="90" y="330" width="130" height="56" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="155" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">Cliente Web</text>
      <rect x="320" y="330" width="150" height="56" fill="#ffffff" stroke="#e5322d" stroke-width="3"/>
      <text x="395" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#111111">API Gateway</text>
      <rect x="315" y="325" width="9" height="9" fill="#ffffff" stroke="#e5322d" stroke-width="2"/>
      <rect x="466" y="325" width="9" height="9" fill="#ffffff" stroke="#e5322d" stroke-width="2"/>
      <rect x="315" y="382" width="9" height="9" fill="#ffffff" stroke="#e5322d" stroke-width="2"/>
      <rect x="466" y="382" width="9" height="9" fill="#ffffff" stroke="#e5322d" stroke-width="2"/>
      <ellipse cx="645" cy="350" rx="75" ry="36" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="645" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">PostgreSQL</text>
      <ellipse cx="645" cy="486" rx="62" ry="30" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <text x="645" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">Redis</text>
      <rect x="800" y="330" width="120" height="56" fill="#ffeceb" stroke="#111111" stroke-width="2"/>
      <text x="860" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">Lambda</text>
      <path d="M570 350 H795" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    </svg>
  </div>

  <div class="tag widget">05 · Swiss Ink</div>

  <button class="menu-btn" aria-label="Menu">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>

  <div class="toolbar widget">
    <button class="tb active" title="Selecionar"><svg width="18" height="18" viewBox="0 0 20 20"><path d="M6 3l8 8-4.2.5 2 3.8-1.7.9-2-3.9L6 14z" fill="currentColor"/></svg></button>
    <button class="tb" title="Mão"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 12V6.2a1.3 1.3 0 0 1 2.6 0V11m0-5.8v-.9a1.3 1.3 0 0 1 2.6 0V11m0-4.3a1.3 1.3 0 0 1 2.6 0V13c0 2.6-1.9 4.2-4.4 4.2-2 0-3-.7-4-2.4l-2.1-3.6c-.5-.8.6-1.9 1.5-1.2L7 12"/></svg></button>
    <div class="sep"></div>
    <button class="tb" title="Retângulo"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="6" width="12" height="8"/></svg></button>
    <button class="tb" title="Losango"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4l6 6-6 6-6-6z"/></svg></button>
    <button class="tb" title="Elipse"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="10" cy="10" rx="6" ry="4.5"/></svg></button>
    <div class="sep"></div>
    <button class="tb" title="Linha"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 15L15 5"/></svg></button>
    <button class="tb" title="Seta"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 15L15 5M9 5h6v6"/></svg></button>
    <button class="tb" title="Texto"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 6h10M10 6v9"/></svg></button>
  </div>

  <div class="props widget">
    <div class="ptabs">
      <button class="ptab active">Estilo</button>
      <button class="ptab">Texto</button>
    </div>
    <div class="pgroup">
      <span class="micro">Preenchimento</span>
      <div class="prow">
        <div class="sw" style="background:#ffffff"></div>
        <div class="sw" style="background:#dddddd"></div>
        <div class="sw on" style="background:#ffeceb"></div>
        <div class="sw" style="background:#111111"></div>
        <div class="sw" style="background:#e5322d"></div>
      </div>
    </div>
    <div class="pgroup">
      <span class="micro">Traço</span>
      <div class="prow">
        <div class="sw on" style="background:#e5322d"></div>
        <div class="sw" style="background:#111111"></div>
        <div class="sw" style="background:#757575"></div>
        <div class="sw" style="background:#dddddd"></div>
        <div class="sw" style="background:#ffffff"></div>
      </div>
    </div>
    <div class="pgroup">
      <span class="micro">Espessura</span>
      <div class="prow">
        <button class="szbtn"><span class="bar" style="height:2px"></span></button>
        <button class="szbtn"><span class="bar" style="height:4px"></span></button>
        <button class="szbtn on"><span class="bar" style="height:6px"></span></button>
        <button class="szbtn"><span class="bar" style="height:8px"></span></button>
      </div>
    </div>
    <div class="pgroup">
      <span class="micro">Estilo do traço</span>
      <div class="prow">
        <button class="szbtn on"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 7h12" stroke="currentColor" stroke-width="2"/></svg></button>
        <button class="szbtn"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 7h12" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.5"/></svg></button>
        <button class="szbtn"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 7h12" stroke="currentColor" stroke-width="2" stroke-dasharray="1 3" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="pgroup">
      <span class="micro">Camadas</span>
      <div class="prow">
        <button class="szbtn" title="Para frente"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 11V3M3.5 6.5L7 3l3.5 3.5"/></svg></button>
        <button class="szbtn" title="Para trás"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3v8M3.5 7.5L7 11l3.5-3.5"/></svg></button>
      </div>
    </div>
  </div>

  <div class="tabbar widget">
    <button class="tab">infra</button>
    <button class="tab active">checkout · pagamentos <span>×</span></button>
    <button class="tabadd">+</button>
  </div>

  <div class="bottom-right">
    <div class="zoom widget">
      <button class="zbtn">−</button>
      <span class="zlevel">100%</span>
      <button class="zbtn">+</button>
    </div>
    <div class="zoom widget">
      <button class="zbtn" title="Desfazer"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7a4.5 4.5 0 1 1 1.3 3.2M3 7V3.5M3 7h3.5"/></svg></button>
      <button class="zbtn" title="Refazer"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 7a4 4 0 1 0-1.3 3.2M11 7V3.5M11 7H7.5"/></svg></button>
    </div>
  </div>

  <div class="status">
    <span class="saved">● Salvo</span>
    <span>8 elementos</span>
  </div>
</div>
</body>
</html>
