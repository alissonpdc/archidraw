name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc -b

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  test:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_WORKERS: "5"
          E2E_RETRIES: "1"
          PERF_ELEMENTS: "100"
          PERF_MIN_FPS: "30"

  version:
    name: Definir versão
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      last_tag: ${{ steps.version.outputs.last_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Definir versão (semver automático pelo histórico de commits)
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LAST=${LAST_TAG#v}
          MAJOR=$(echo "$LAST" | cut -d. -f1)
          MINOR=$(echo "$LAST" | cut -d. -f2)
          PATCH=$(echo "$LAST" | cut -d. -f3)
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            RANGE="HEAD"
          else
            RANGE="$LAST_TAG..HEAD"
          fi
          if git log --pretty=format:"%B %s" "$RANGE" | grep -qiE "BREAKING CHANGE|^(feat|fix|refactor|perf|chore|docs|test|build|ci)(\([^)]*\))?!:"; then
            NEW_TAG="v$((MAJOR + 1)).0.0"
          elif git log --pretty=format:"%s" "$RANGE" | grep -qE "^feat(\([^)]*\))?:"; then
            NEW_TAG="v${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Versão: $LAST_TAG -> $NEW_TAG"

  build:
    name: Build
    needs: [lint, typecheck, security, test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.version.outputs.new_tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  release:
    name: GitHub Release
    needs: [build, version]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Selecionar melhor modelo free (OpenRouter)
        id: model
        run: |
          curl -s "https://openrouter.ai/api/v1/models" \
            -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
            -o /tmp/models_raw.json

          python3 << 'PYEOF'
          import json, re

          with open("/tmp/models_raw.json") as f:
              raw = f.read()

          clean = re.sub(r'[\x00-\x1f\x7f]', ' ', raw)
          data = json.loads(clean)
          models = data.get("data", [])

          free = []
          for m in models:
              p = m.get("pricing", {})
              if str(p.get("prompt", "1")) == "0" and str(p.get("completion", "1")) == "0":
                  arch = m.get("architecture", {})
                  modality = arch.get("modality", "")
                  if modality.endswith("->text") or modality == "text->text":
                      mid = m["id"]
                      if "inkling" in mid.lower():
                          continue
                      free.append(m)

          free.sort(key=lambda m: m.get("context_length") or 0, reverse=True)

          if free:
              best = free[0]["id"]
              print(f"Melhor modelo free: {best} (ctx={free[0].get('context_length', 0)})")
              with open("/tmp/model_output.txt", "w") as f:
                  f.write(best)
          else:
              print("Nenhum modelo free encontrado, usando fallback")
              with open("/tmp/model_output.txt", "w") as f:
                  f.write("google/gemma-3-12b-it:free")
          PYEOF

          BEST_MODEL=$(cat /tmp/model_output.txt)
          echo "model=$BEST_MODEL" >> "$GITHUB_OUTPUT"

      - name: Gerar release notes (OpenRouter + fallback)
        run: |
          LAST_TAG="${{ needs.version.outputs.last_tag }}"
          PRIMARY_MODEL="${{ steps.model.outputs.model }}"
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            RANGE="HEAD"
          else
            RANGE="$LAST_TAG..HEAD"
          fi
          git log --no-merges --pretty=format:"- %s" "$RANGE" | grep -v "release:" > /tmp/commits.txt
          git diff --stat "$RANGE" 2>/dev/null > /tmp/diff.txt || echo "N/A" > /tmp/diff.txt
          echo "$PRIMARY_MODEL" > /tmp/model.txt
          echo "${{ secrets.OPENROUTER_API_KEY }}" > /tmp/api_key.txt

          python3 "$GITHUB_WORKSPACE/.github/scripts/generate_release_notes.py"

          echo "----- Release notes geradas -----"
          cat /tmp/release_notes.txt

      - name: Definir release notes como output
        id: notes
        run: |
          python3 -c "
          import os, uuid
          content = open('/tmp/release_notes.txt').read()
          delim = 'X' + uuid.uuid4().hex
          out_path = os.environ['GITHUB_OUTPUT']
          with open(out_path, 'a') as f:
              f.write(f'notes<<{delim}\n')
              f.write(content)
              f.write(f'\n{delim}\n')
          "

      - name: Criar tag e publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: ArchiDraw ${{ needs.version.outputs.new_tag }}
          body: ${{ steps.notes.outputs.notes }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload do build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.new_tag }}
          path: dist/
          retention-days: 30

  deploy:
    name: Deploy S3 + CloudFront
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: sa-east-1
      - name: Sync S3 Assets (Cache-Control)
        run: |
          aws s3 sync dist/assets/ s3://${{ vars.URL }}-prod/assets/ --delete --region sa-east-1 --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ s3://${{ vars.URL }}-prod --delete --region sa-east-1 --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp dist/ai/full.md s3://${{ vars.URL }}-prod/ai --content-type "text/markdown; charset=utf-8" --cache-control "public, max-age=0, must-revalidate"
          aws s3api put-object --bucket "${{ vars.URL }}-prod" --key "ai/" --body fileb://dist/ai/full.md --content-type "text/markdown; charset=utf-8" --cache-control "public, max-age=0, must-revalidate"
      - name: Invalidar CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.AWS_CLOUDFRONT_ID_PROD }} --paths "/*"

  docker:
    name: Docker Hub
    needs: release
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Metadata (tags da imagem)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/archidraw
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_APP_VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

